[package]
name = "mydocdesk"
version = "0.1.0"
edition = "2021"
description = "MyDocDesk - personal local-first document AI desk"

[[bin]]
name = "mydocdesk"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "=0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
chrono = "0.4"
getrandom = "0.2"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
pdf-extract = "0.9"
encoding_rs = "0.8"
cfb = "0.10"
flate2 = "1"
base64 = "0.22"
regex = "1"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# API keys and the remembered sync password go to the macOS Keychain
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
# ... and to the Windows Credential Manager
keyring = { version = "=3.6.3", features = ["windows-native"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `cargo bundle --release` (cargo-bundle) makes MyDocDesk.app on macOS and an .msi on Windows.
[package.metadata.bundle]
name = "MyDocDesk"
identifier = "local.mydocdesk.app"
short_description = "개인 문서 AI 데스크"
category = "Productivity"

[dev-dependencies]
# E2E: 실제 DeskApp 을 화면 없이 띄워 버튼을 찾고 누르는 테스트 (egui 와 같은 0.31.1 로 고정)
egui_kittest = { version = "=0.31.1", features = ["eframe"] }
